<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Agents</title>
  <style>
    body { margin: 0; font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif; color: #1c1c1c; background: #f7f6f3; }
    header, main { max-width: 880px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #ddd; }
    a { color: #1c1c1c; }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 16px; }
    h2 { font-size: 18px; margin: 28px 0 8px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e6e6e6; vertical-align: top; }
    form.inline { display: inline; }
    button, input, textarea { font: inherit; }
    button { background: #1c1c1c; color: #fff; border: 0; padding: 8px 14px; cursor: pointer; }
    button.secondary { background: #fff; color: #1c1c1c; border: 1px solid #1c1c1c; }
    textarea, input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; background: #fff; }
    .error { background: #fff4f0; border: 1px solid #e7b2a4; padding: 12px; }
    .status { font-variant: small-caps; letter-spacing: 0.04em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    pre { white-space: pre-wrap; background: #fff; padding: 12px; border: 1px solid #e6e6e6; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="/agents">Trading Agents</a>
    <a href="/agents/new">New</a>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
